<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ladybird menu, dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121316}
a{color:#6A39DB}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; color: #ECEAE4; font-family: 'Instrument Sans', system-ui, sans-serif">
  <dc-import name="BrowseDark" loading="{{ 100 }}" hint-size="390px,844px"></dc-import>
  <a href="BrowseDark.dc.html" aria-label="Close menu" style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.55)"></a>

  <section aria-label="Menu" style="position: absolute; top: 112px; right: 8px; width: 286px; background: #1D1F24; border-radius: 24px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6); padding: 10px; display: flex; flex-direction: column; gap: 2px">
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding-bottom: 8px; border-bottom: 1px solid #2A2D33; margin-bottom: 4px">
      <sc-for list="{{quick}}" as="q" hint-placeholder-count="4">
        <button aria-label="{{q.label}}" style="height: 52px; border: 0; border-radius: 16px; background: #272A30; display: flex; align-items: center; justify-content: center; color: #ECEAE4">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{q.icon}}"></path></svg>
        </button>
      </sc-for>
    </div>

    <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
      <a href="{{r.href}}" style="display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 0 10px; border-radius: 14px; color: #ECEAE4; text-decoration: none; font-size: 16px; font-weight: 500">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg>
        <span style="flex: 1">{{r.label}}</span>
        <sc-if value="{{r.hasNote}}" hint-placeholder-val="{{ false }}">
          <span style="font-size: 13px; color: #8F929B">{{r.note}}</span>
        </sc-if>
      </a>
    </sc-for>

    <div style="display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 0 10px; border-top: 1px solid #2A2D33; margin-top: 4px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg>
      <span style="flex: 1; font-size: 16px; font-weight: 500">Desktop site</span>
      <button aria-pressed="false" aria-label="Desktop site" style="width: 48px; height: 30px; border: 0; border-radius: 999px; padding: 3px; background: #4A4D55; display: flex; justify-content: flex-start"><span style="width: 24px; height: 24px; border-radius: 999px; background: #1D1F24"></span></button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const quick = [
      ['Forward', 'M9 5l7 7-7 7'],
      ['Bookmark', 'M6 4h12v17l-6-4-6 4z'],
      ['Find in page', 'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM16 16l5 5'],
      ['Share', 'M12 3v12M8 7l4-4 4 4M5 13v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6']
    ].map(([label, icon]) => ({ label, icon }));
    const rows = [
      ['New tab', 'M12 5v14M5 12h14', 'NewTabDark.dc.html', ''],
      ['New private tab', 'M4 10c2-5 14-5 16 0M5 14a3 3 0 1 0 6 0M13 14a3 3 0 1 0 6 0M11 14h2', 'TabsDark.dc.html', ''],
      ['Bookmarks', 'M6 4h12v17l-6-4-6 4z', 'BrowseDark.dc.html', ''],
      ['History', 'M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17zM12 7.5V12l3 2', 'BrowseDark.dc.html', ''],
      ['Downloads', 'M12 4v11M7 10l5 5 5-5M5 20h14', 'BrowseDark.dc.html', '1 new'],
      ['Settings', 'M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM19 12l2-1-1-3-2 .3-1.4-1.4.3-2-3-1-1 2h-2l-1-2-3 1 .3 2L5.8 7.3 4 7 3 10l2 1v2l-2 1 1 3 2-.3 1.4 1.4-.3 2 3 1 1-2h2l1 2 3-1-.3-2 1.4-1.4 2 .3 1-3-2-1z', 'BrowseDark.dc.html', '']
    ].map(([label, icon, href, note]) => ({ label, icon, href, note, hasNote: note !== '' }));
    return { quick, rows };
  }
}
</script>
</body>
</html>
