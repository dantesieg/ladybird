<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6A39DB","options":["#6A39DB","#5B2FC4","#C8202B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const tints = ['#ECE6FB', '#DDE6D5', '#DCE7F2', '#F3E6CF'];
    const names = ['Ladybird', 'Field notes', 'Weather', 'Wikipedia', 'Home', 'Photos', 'Mail', 'Maps'];
    const favourites = names.map((name, i) => ({
      name, initial: name[0],
      tileStyle: 'width: 56px; height: 56px; border-radius: 18px; background: ' + tints[i % 4] + '; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; color: #17181C'
    }));
    return { accent: this.props.accent ?? '#6A39DB', favourites };
  }
}
</script>
