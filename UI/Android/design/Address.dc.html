<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ladybird address bar editing</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6A39DB}a:hover{color:#17181C}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FBFAF7; color: #17181C; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column">

  <div style="padding: 10px 8px 8px; background: #FBFAF7; border-bottom: 1px solid #E7E5DF; display: flex; align-items: center; gap: 4px">
    <label style="flex: 1; min-width: 0; height: 48px; padding: 0 6px 0 16px; border-radius: 999px; background: #FFFFFF; border: 2px solid {{accent}}; box-sizing: border-box; display: flex; align-items: center; gap: 8px">
      <input aria-label="Search or type address" value="oak leaf beetles" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 16px; color: #17181C">
      <button aria-label="Clear" style="width: 36px; height: 36px; border: 0; border-radius: 999px; background: #F1EFEA; display: flex; align-items: center; justify-content: center; color: #17181C">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </label>
    <a href="Browse.dc.html" style="height: 48px; padding: 0 12px; display: flex; align-items: center; font-weight: 600; text-decoration: none; color: #17181C">Cancel</a>
  </div>

  <section aria-label="Suggestions" style="flex: 1; min-height: 0; overflow: hidden; padding: 10px 8px 0; display: flex; flex-direction: column; gap: 2px">
    <div style="display: flex; gap: 8px; padding: 0 6px 10px">
      <button style="height: 40px; padding: 0 14px; border: 1px solid #E7E5DF; border-radius: 999px; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 500; color: #17181C; display: flex; align-items: center; gap: 8px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="3" width="8" height="4" rx="1"></rect><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"></path></svg>Paste link</button>
      <button style="height: 40px; padding: 0 14px; border: 1px solid #E7E5DF; border-radius: 999px; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 500; color: #17181C; display: flex; align-items: center; gap: 8px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"></path><path d="M16 6l-4-4-4 4"></path><path d="M12 2v13"></path></svg>Share page</button>
    </div>
    <sc-for list="{{suggestions}}" as="s" hint-placeholder-count="4">
      <a href="Browse.dc.html" style="display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 6px 12px; border-radius: 16px; color: #17181C; text-decoration: none">
        <span style="{{s.iconStyle}}">
          <sc-if value="{{s.isSearch}}" hint-placeholder-val="{{ true }}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
          </sc-if>
          <sc-if value="{{s.isHistory}}" hint-placeholder-val="{{ false }}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>
          </sc-if>
        </span>
        <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1">
          <span style="font-size: 16px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{s.title}}</span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #5D6069; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{s.detail}}</span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5D6069" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M17 7L7 17"></path><path d="M7 9v8h8"></path></svg>
      </a>
    </sc-for>
  </section>

  <div aria-hidden="true" style="height: 300px; flex: none; background: #E4E2DC; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #5D6069">[Android keyboard]</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6A39DB","options":["#6A39DB","#5B2FC4","#C8202B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      ['s', 'oak leaf beetles', 'Search with your search engine'],
      ['s', 'oak leaf beetles identification', 'Search with your search engine'],
      ['h', 'Oak leaf miners, a field guide', 'fieldnotes.example/oak-miners'],
      ['h', 'Beetle larvae, week by week', 'fieldnotes.example/larvae']
    ];
    const suggestions = rows.map(([k, title, detail]) => ({
      title, detail,
      isSearch: k === 's',
      isHistory: k === 'h',
      iconStyle: 'flex: none; width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; ' + (k === 's' ? 'background: #ECE6FB; color: #4B22A8' : 'background: #F1EFEA; color: #17181C')
    }));
    return { accent: this.props.accent ?? '#6A39DB', suggestions };
  }
}
</script>
</body>
</html>
